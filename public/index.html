<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ปิ่นโตเก่งขึ้นทุกวัน</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header class="top">
    <a class="brand" href="#/">ปิ่นโตเก่งขึ้นทุกวัน</a>
    <span id="fakeBadge" class="badge" hidden>โหมดทดลอง · ไม่เสียเงิน</span>
    <span class="grow"></span>
    <span id="ver" class="muted"></span>
    <a id="updLink" class="link" href="#" hidden>ตรวจหาอัปเดต</a>
    <a id="keyLink" class="link" href="#/key" hidden>เปลี่ยนคีย์</a>
  </header>
  <div id="updBanner" class="upd" hidden></div>
  <main id="app"><p class="muted">กำลังเปิด…</p></main>

  <div id="busy" class="overlay" hidden>
    <div class="card busy-card">
      <div class="spinner"></div>
      <div id="busyText" class="busy-text"></div>
      <div id="busySub" class="muted"></div>
    </div>
  </div>

  <div id="msg" class="overlay" hidden>
    <div class="card msg-card" role="alertdialog" aria-labelledby="msgText">
      <div id="msgIcon" class="msg-icon">⚠</div>
      <div id="msgText" class="msg-text"></div>
      <button id="msgOk" class="btn">ตกลง</button>
    </div>
  </div>

  <script type="module" src="/app.js"></script>
</body>
</html>
